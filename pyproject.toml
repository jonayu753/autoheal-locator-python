[tool.poetry.dependencies]
python = "^3.10"

# Core automation frameworks
selenium = "^4.21.0"
playwright = { version = "^1.45.0", optional = true }

# HTTP and async
httpx = "^0.28.0"
aiohttp = "^3.9.7"

# Configuration and validation
pydantic = "^2.8.0"
pydantic-settings = "^2.4.0"
python-dotenv = "^1.0.2"
pyyaml = "^6.0.3"

# Caching
cachetools = "^5.5.0"
redis = { version = "^5.1.0", optional = true }
diskcache = "^5.6.4"
filelock = "^3.16.0"

# Resilience
tenacity = "^9.3.0"

# Metrics and monitoring
prometheus-client = "^0.21.0"

# Reporting
jinja2 = "^3.1.5"

# Utilities
pillow = "^10.4.0"
typing-extensions = "^4.13.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.1.0"
pytest-mock = "^3.15.0"
pytest-timeout = "^2.4.0"
pytest-xdist = "^3.7.0"

black = "^24.8.0"
isort = "^5.14.0"
flake8 = "^7.1.0"
mypy = "^1.11.0"
pylint = "^3.3.0"
bandit = "^1.8.0"
pre-commit = "^3.8.0"

# Documentation
sphinx = "^7.4.0"
sphinx-rtd-theme = "^2.1.0"
mkdocs = "^1.6.1"
mkdocs-material = "^9.7.0"

# Testing utilities
responses = "^0.26.0"
faker = "^26.0.0"
testcontainers = { version = "^4.7.0", extras = ["selenium"] }
